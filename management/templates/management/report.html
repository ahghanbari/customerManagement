{% load static %}
{% load humanize %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>گزارش درآمد</title>
        <style>
            body {
                font-family:Helvetica, sans-serif;
                color:#222;
                line-height:1.5;
            }

            table {
                width:100%;
                border-spacing:0;
                border-collapse: collapse;
                margin:20px 0;
            }

            table th, table td {
                text-align:left;
                font-size:14px;
                padding:10px;
                margin:0;
            }

            tbody tr:nth-child(odd) {
                background:#efefef;
            }

            thead th, tbody tr.total {
                background:#5993bb;
                color:#fff;
                font-weight:bold;
            }

            h1 {
                margin:0;
            }


            .secondary {
                color:#bbb;
                margin-bottom:20px;
            }

            .num {
                text-align:right;
            }

            .paid, .pending {
                color:#1bae37;
                border:4px solid #1bae37;
                text-transform:uppercase;
                font-weight:bold;
                font-size:22px;
                padding:4px 12px 0px;
                float:right;
                transform: rotate(-15deg);
                margin-right:40px;
            }

            .pending {
                color:#a82d2d;
                border:4px solid #a82d2d;
            }

        </style>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
<body>
  <h3 style="text-align: center;">گزارش درآمد سال ۱۴۰۵</h3>
  <table dir="rtl">
    <thead>
      <tr>
        <th>ماه</th>
        <th>هزینه قطعات</th>
        <th>درآمد</th>
      </tr>
    </thead>
    <tbody>
      {% for obj in objects %}
        <tr class="row{% cycle "1" "2" %}">
          <td>{{ obj.date }}</td>
          <td>{{ obj.tools_total }} تومان</td>
          <td>{{ obj.cost_total }} تومان</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  <a dir="rtl" href="{% url 'admin:management_customer_changelist' %}">بازگشت به پنل مدیریت</a>
</body>
</html>
